[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "otter"
version = "0.2.0"
description = "OTTER: Ontology from Textbooks for Teaching and Educational Reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["otter*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
